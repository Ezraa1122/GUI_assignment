<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">CF</div>
          <div>
            <p class="eyebrow">University campus hub</p>
            <h1>CampusFind</h1>
          </div>
        </div>
        <button class="ghost-button" type="button">Quick report</button>
      </header>

      <main class="layout">
        <section class="panels left-panel">
          <div class="hero-card">
            <p class="eyebrow accent">Lost & found made simple</p>
            <h2>Find what you lost, faster.</h2>
            <p>
              Track misplaced items across campus buildings and claim them with a few taps.
            </p>
          </div>

          <div class="stats-grid" aria-label="Summary statistics">
            <article class="stat-card">
              <span class="stat-label">Open cases</span>
              <strong id="stat-open">0</strong>
            </article>
            <article class="stat-card">
              <span class="stat-label">Claimed today</span>
              <strong id="stat-claimed">0</strong>
            </article>
            <article class="stat-card">
              <span class="stat-label">Buildings</span>
              <strong id="stat-buildings">0</strong>
            </article>
          </div>

          <section class="panel-card controls-panel">
            <div class="panel-header-row">
              <h3>Search and filter</h3>
            </div>

            <label class="field-label" for="searchInput">Search items</label>
            <div class="search-wrap">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="Search by item name or description" maxlength="80" />
            </div>

            <div class="filter-group" aria-label="Status filters">
              <button class="filter-chip is-active" type="button" data-status="all">All</button>
              <button class="filter-chip" type="button" data-status="Lost">Lost</button>
              <button class="filter-chip" type="button" data-status="Found">Found</button>
              <button class="filter-chip" type="button" data-status="Claimed">Claimed</button>
            </div>

            <label class="field-label" for="buildingFilter">Building</label>
            <select id="buildingFilter">
              <option value="all">All buildings</option>
            </select>
          </section>

          <section class="panel-card form-panel">
            <div class="panel-header-row">
              <h3>Quick report</h3>
            </div>

            <form id="reportForm" novalidate>
              <div class="field-row two-up">
                <div>
                  <label class="field-label" for="itemName">Item</label>
                  <input id="itemName" name="itemName" type="text" placeholder="e.g. orange notebook" maxlength="50" required />
                </div>
                <div>
                  <label class="field-label" for="itemCategory">Category</label>
                  <select id="itemCategory" name="itemCategory">
                    <option value="Accessories">Accessories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Documents">Documents</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <div class="field-row two-up">
                <div>
                  <label class="field-label" for="itemStatus">Status</label>
                  <select id="itemStatus" name="itemStatus">
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                  </select>
                </div>
                <div>
                  <label class="field-label" for="itemBuilding">Building</label>
                  <select id="itemBuilding" name="itemBuilding">
                    <option value="Central Library">Central Library</option>
                    <option value="Lecture Hall A">Lecture Hall A</option>
                    <option value="Engineering Block">Engineering Block</option>
                    <option value="Science Centre">Science Centre</option>
                    <option value="Student Union">Student Union</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="field-label" for="itemDescription">Description</label>
                <textarea id="itemDescription" name="itemDescription" rows="3" maxlength="160" placeholder="Add a few identifying details"></textarea>
              </div>

              <button class="primary-button" type="submit">Submit report</button>
            </form>
          </section>
        </section>

        <section class="panels right-panel">
          <div class="listing-header">
            <div>
              <p class="eyebrow">Live listings</p>
              <h3>Campus notices</h3>
            </div>
            <span id="resultCount" class="result-count">0 items</span>
          </div>

          <div id="itemsList" class="items-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js"></script>
  </body>
</html>
